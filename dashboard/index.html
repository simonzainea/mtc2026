<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MTC Show Dashboard</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
</head>
<body>

<div id="login-screen">
    <h2>Majestic Theater Center Dashboard</h2>
    <input type="password" id="password-input" placeholder="Enter password">
    <button id="login-btn">Log In</button>
    <div id="login-error"></div>
</div>

<div id="app-screen" style="display: none">
    <h2>Welcome</h2>
    <button id="query-btn">Query</button>
    <button id="insert-btn">Insert Event</button>
    <button id="logout-btn">Logout</button>

    <ul id="recent-list"></ul>
</div>


<div id="query-screen" style="display: none">
    <h2>Query</h2>

    <button id="back-from-query-btn">← Back to Preview</button>
    <input type="text" id="artist-search" placeholder="Search artist name...">

    <select id="venue-select">
        <option value="">All Venues</option>
        <option value="Majestic Theatre">Majestic Theater</option>
        <option value="Magic Stick">Magic Stick</option>
    </select>

    <select id="year-select">
        <option value="">All Years</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2019">2019</option>
    </select>

    <select id="quarter-select">
        <option value="">All Quarters</option>
        <option value="1">Q1 (Jan–Mar)</option>
        <option value="2">Q2 (Apr–Jun)</option>
        <option value="3">Q3 (Jul–Sep)</option>
        <option value="4">Q4 (Oct–Dec)</option>
    </select>

    <select id="month-select">
        <option value="">All Months</option>
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
    </select>

    <label>From <input type="date" id="date-from"></label>
    <label>To <input type="date" id="date-to"></label>

    <div id="genre-checkboxes">
        <label><input type="checkbox" value="Rock"> Rock</label>
        <label><input type="checkbox" value="Electronic/Dance"> Electronic/Dance</label>
        <label><input type="checkbox" value="Hip-Hop/R&B"> Hip-Hop/R&B</label>
        <label><input type="checkbox" value="Metal/Hard Rock"> Metal/Hard Rock</label>
        <label><input type="checkbox" value="Pop"> Pop</label>
        <label><input type="checkbox" value="Comedy/Other"> Comedy/Other</label>
        <label><input type="checkbox" value="Jazz/Blues/Soul"> Jazz/Blues/Soul</label>
        <label><input type="checkbox" value="Country/Americana"> Country/Americana</label>
    </div>

    <div id="column-checkboxes">
        <label><input type="checkbox" value="artist_name" checked> Artist</label>
        <label><input type="checkbox" value="show_date" checked> Date</label>
        <label><input type="checkbox" value="venue" checked> Venue</label>
        <label><input type="checkbox" value="tickets_sold" checked> Tickets Sold</label>
        <label><input type="checkbox" value="gross_ticket_revenue" checked> Gross Ticket Revenue</label>
        <label><input type="checkbox" value="bar_revenue" checked> Bar Revenue</label>
        <label><input type="checkbox" value="gate_settlement_gain_loss"> Gate</label>
        <label><input type="checkbox" value="show_gross_proceeds"> Show Gross Proceeds</label>
    </div>



    <select id="sort-select">
        <option value="show_date">Date</option>
        <option value="show_gross_proceeds">Gross Proceeds</option>
        <option value="bar_revenue">Bar Revenue</option>
        <option value="gate_settlement_gain_loss">Gate</option>
    </select>

    <label>
        <input type="checkbox" id="bar-toggle">Adjusted Bar (28% COGS)
    </label>

    <label>
        <input type="checkbox" id="aeg-toggle">AEG Split (For Majestic Only)
    </label>

    <label>
        <input type="checkbox" id="ascending-toggle">Ascending
    </label>

    
    <ul id="query-results"></ul>
    <select id="limit-select">
        <option value="25">25 results</option>
        <option value="50" selected>50 results</option>
        <option value="100">100 results</option>
        <option value="100000">All results</option>
    </select>

    <button id="search-btn">Search</button>
    <button id="reset-btn">Reset filters</button>

</div>


<div id="insert-screen" style="display: none">
    <h2>Insert</h2>
    <button id="back-from-insert-btn">← Back to Preview</button>
    <label>Venue
        <select id="insert-venue">
            <option value="Majestic Theatre">Majestic Theatre</option>
            <option value="Magic Stick">Magic Stick</option>
        </select>
    </label>
    <label>Artist Name <input type="text" id="insert-artist"></label>
    <label>Date <input type="date" id="insert-date"></label>
    <label>Genre
        <select id="insert-genre">
            <option value="Rock">Rock</option>
            <option value="Electronic/Dance">Electronic/Dance</option>
            <option value="Hip-Hop/R&B">Hip-Hop/R&B</option>
            <option value="Metal/Hard Rock">Metal/Hard Rock</option>
            <option value="Pop">Pop</option>
            <option value="Comedy/Other">Comedy/Other</option>
            <option value="Jazz/Blues/Soul">Jazz/Blues/Soul</option>
            <option value="Country/Americana">Country/Americana</option>
        </select>
    </label>
    <label>Tickets Sold <input type="number" id="insert-tickets"></label>
    <label>Gross Ticket Revenue <input type="number" step="0.01" id="insert-gross-ticket"></label>
    <label>Bar Revenue <input type="number" step="0.01" id="insert-bar"></label>
    <label>Band Guarantee <input type="number" step="0.01" id="insert-guarantee"></label>
    <label>Total Gate Settlement <input type="number" step="0.01" id="insert-gate"></label>

    <label>Promoter Code <input type="text" id="insert-promoter-code"></label>
    <label>Promoter Name <input type="text" id="insert-promoter-name"></label>

    <button id="add-event-btn">Add event</button>
    <div id="insert-status"></div>
</div>


<script>
    const SUPABASE_URL = 'https://idvimzbptayvfrpvfjzq.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_3oftkJ_frqxr0wJRTPq_eg_LGeG-EXO'
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('login-btn').addEventListener('click', login);
    document.getElementById('insert-btn').addEventListener('click', insert);
    document.getElementById('add-event-btn').addEventListener('click', addEvent);
    document.getElementById('query-btn').addEventListener('click', query);
    document.getElementById('search-btn').addEventListener('click', search);
    document.getElementById('reset-btn').addEventListener('click', () => {
        document.getElementById('venue-select').value = '';
        document.getElementById('year-select').value = '';
        document.getElementById('quarter-select').value = '';
        document.getElementById('month-select').value = '';
        document.getElementById('date-from').value = '';
        document.getElementById('date-to').value = '';
        document.getElementById('limit-select').value = '50';
        document.getElementById('sort-select').value = 'show_date';
        document.getElementById('ascending-toggle').checked = false;
        document.getElementById('artist-search').value = '';

        document.querySelectorAll('#genre-checkboxes input[type="checkbox"]').forEach(cb => {
            cb.checked = false;
        });
        document.getElementById('query-results').innerHTML = '';
    });

    async function login() {
        const password = document.getElementById('password-input').value;
        const errorBox = document.getElementById('login-error');
        const { error } = await sb.auth.signInWithPassword({
            email: "team@majesticdetroit.com",
            password: password
        });

        if (error) {
            errorBox.textContent = 'Incorrect password. Try again.';
            return;
        }

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';

        loadPreview();
    }

    async function loadPreview() {
        const { data, error } = await sb
            .from('shows')
            .select('*')
            .order('show_date', { ascending: false })
            .limit(10)

        console.log(data);

        const container = document.getElementById('recent-list');

        data.forEach(show => {
            const li = document.createElement('li');
            li.textContent = show.artist_name + '-' + show.show_date + '-' + show.venue + '-' +
                            show.tickets_sold + '-' + show.gross_ticket_revenue + '-' + show.bar_revenue
            container.appendChild(li);
        });
    }

    async function query() {
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('query-screen').style.display = 'block';
    }

    async function insert() {
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('insert-screen').style.display = 'block';
    }

    async function search() {
        const artistSearch = document.getElementById('artist-search').value;
        const venue = document.getElementById('venue-select').value;
        const limit = parseInt(document.getElementById('limit-select').value);
        const sort_column = document.getElementById('sort-select').value;
        const asc_toggle = document.getElementById('ascending-toggle').checked;
        const year = document.getElementById('year-select').value;
        const quarter = document.getElementById('quarter-select').value;
        const month = document.getElementById('month-select').value;
        const dateFrom = document.getElementById('date-from').value;
        const dateTo = document.getElementById('date-to').value;
        const barCogsToggle = document.getElementById('bar-toggle').checked;
        const aegToggle = document.getElementById('aeg-toggle').checked;

        const checkboxes = document.querySelectorAll('#genre-checkboxes input[type="checkbox"]');
        const selectedGenres = [];
        checkboxes.forEach(checkbox => {
            if (checkbox.checked) {
                selectedGenres.push(checkbox.value);
            }
        });

        let queryBuilder = sb.from('shows').select('*');

        if (venue) {
            queryBuilder = queryBuilder.eq('venue', venue);
        }
        if (selectedGenres.length > 0) {
            queryBuilder = queryBuilder.in('genre', selectedGenres);
        }
        if (year) {
            const yearStart = year + '-01-01';
            const yearEnd = year + '-12-31';
            queryBuilder = queryBuilder.gte('show_date', yearStart).lte('show_date', yearEnd);
        }
        if (dateFrom) {
            queryBuilder = queryBuilder.gte('show_date', dateFrom);
        }
        if (dateTo) {
            queryBuilder = queryBuilder.lte('show_date', dateTo);
        }

        queryBuilder = queryBuilder.order(sort_column, { ascending: asc_toggle });

        const { data, error } = await queryBuilder;

        let results = data;

        if (quarter) {
            results = results.filter(show => {
                const showMonthForQuarter = parseInt(show.show_date.slice(5, 7));
                const showQuarter = Math.ceil(showMonthForQuarter / 3);
                return showQuarter === parseInt(quarter);
            });
        }

        if (month) {
            results = results.filter(show => {
                const showMonth = parseInt(show.show_date.slice(5, 7));
                return showMonth === parseInt(month);
            });
        }

        if (artistSearch) {
            const fuse = new Fuse(results, { keys: ['artist_name'], threshold: 0.3 });
            const fuseResults = fuse.search(artistSearch);
            results = fuseResults.map(result => result.item);
        }

        results = results.slice(0, limit);

        results = results.map(show => {
            const adjusted = { ...show };
            const isMajestic = show.venue === 'Majestic Theatre';

            if (isMajestic && aegToggle && barCogsToggle) {
                adjusted.bar_revenue = show.bar_revenue * 0.42;
            } else if (isMajestic && aegToggle) {
                adjusted.bar_revenue = show.bar_revenue * 0.70;
            } else if (barCogsToggle) {
                adjusted.bar_revenue = show.bar_revenue * 0.72;
            }

            if (isMajestic && aegToggle) {
                adjusted.gate_settlement_gain_loss = show.gate_settlement_gain_loss * 0.50;
            }

            return adjusted;
        });

        console.log(results);

        const selectedColumns = [];
        document.querySelectorAll('#column-checkboxes input[type="checkbox"]').forEach(checkbox => {
            if (checkbox.checked) {
                selectedColumns.push(checkbox.value);
            }
        });

        const container = document.getElementById('query-results');
        container.innerHTML = '';

        results.forEach(show => {
            const li = document.createElement('li');
            const parts = selectedColumns.map(col => show[col]);
            li.textContent = parts.join(' - ');
            container.appendChild(li);
        });
    }

    async function addEvent() {
        const venue = document.getElementById('insert-venue').value;
        const artist = document.getElementById('insert-artist').value;
        const date = document.getElementById('insert-date').value;
        const genre = document.getElementById('insert-genre').value;
        const numTicket = parseInt(document.getElementById('insert-tickets').value);
        const grossTicket = parseFloat(document.getElementById('insert-gross-ticket').value);
        const bar = parseFloat(document.getElementById('insert-bar').value);
        const band = parseFloat(document.getElementById('insert-guarantee').value);
        const gate = parseFloat(document.getElementById('insert-gate').value);

        const promoCode = document.getElementById('insert-promoter-code').value;
        const promoName = document.getElementById('insert-promoter-name').value;

        const venueCap = venue === 'Majestic Theatre' ? 1115 : 800;

        const dayOfWeek = new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long' });

        const capacityRate = numTicket / venueCap;
        const avgTicketPrice = grossTicket / numTicket;
        const avgAlcoholPerGuest = bar / numTicket;
        const pctGrossTicketRevenue = band / grossTicket;
        const showGrossProceeds = gate + bar;

        const newShow = {
            venue: venue,
            show_date: date,
            day_of_week: dayOfWeek,
            artist_name: artist,
            genre: genre,
            promoter_code: promoCode || null,
            promoter_name: promoName || null,
            tickets_sold: numTicket,
            venue_capacity: venueCap,
            capacity_rate: capacityRate,
            gross_ticket_revenue: grossTicket,
            avg_ticket_price: avgTicketPrice,
            bar_revenue: bar,
            avg_alcohol_per_guest: avgAlcoholPerGuest,
            band_guarantee: band,
            pct_gross_ticket_revenue: pctGrossTicketRevenue,
            gate_settlement_gain_loss: gate,
            show_gross_proceeds: showGrossProceeds,
            source_year: new Date(date + 'T00:00:00').getFullYear(),
            source_file: 'Manual Entry via Dashboard',
            data_notes: null
        };

        const { data, error } = await sb.from('shows').insert([newShow]);

        const statusBox = document.getElementById('insert-status');
        if (error) {
            statusBox.textContent = 'Error adding show: ' + error.message;
        } else {
            statusBox.textContent = 'Show added successfully!';
        }
    }

    function goToPreview() {
        document.getElementById('query-screen').style.display = 'none';
        document.getElementById('insert-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
    }

    document.getElementById('back-from-query-btn').addEventListener('click', goToPreview);
    document.getElementById('back-from-insert-btn').addEventListener('click', goToPreview);


    document.getElementById('logout-btn').addEventListener('click', logout);

    async function logout() {
        await sb.auth.signOut();

        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('query-screen').style.display = 'none';
        document.getElementById('insert-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'block';

        document.getElementById('password-input').value = '';
    }
</script>

</body>
</html>
